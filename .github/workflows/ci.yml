name: HeyZen Production CI/CD Pipeline

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Invariant Integrity: Ensure Frozen Frontend and DB Migrations are Untouched
  # ============================================================================
  verify-invariants:
    name: Verify Frozen Frontend & Alembic Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Frozen Frontend Files
        run: |
          echo "[*] Verifying no changes to frozen frontend assets..."
          if git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD | grep -E '^(src/|public/|package\.json|package-lock\.json)'; then
            echo "[FATAL] Modification detected in frozen frontend files!"
            exit 1
          fi
          echo "[+] Frozen frontend integrity verified."

      - name: Verify Alembic Head Invariant
        run: |
          echo "[*] Checking Alembic migration revision consistency..."
          NEW_MIGRATIONS=$(git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD | grep -E '^backend/alembic/versions/' || true)
          if [ -n "$NEW_MIGRATIONS" ]; then
            echo "[FATAL] New or modified Alembic migrations detected without authorization: $NEW_MIGRATIONS"
            exit 1
          fi
          echo "[+] Database migration consistency verified: Alembic head remains 0005_jobs_task_pipeline."

  # ============================================================================
  # 2. Docker Topology Syntax & Production Configuration Validation
  # ============================================================================
  validate-docker:
    name: Validate Docker Topology & Production Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q
          docker compose -f infrastructure/docker/docker-compose.gpu.yml config -q
          echo "[+] All Docker compose configurations syntax validated successfully."

  # ============================================================================
  # 3. Backend Test Suite & Health Validation
  # ============================================================================
  backend-test:
    name: Backend Test Matrix & Static Security
    runs-on: ubuntu-latest
    needs: [verify-invariants, validate-docker]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: heyzen
          POSTGRES_USER: heyzen
          POSTGRES_PASSWORD: heyzen_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heyzen -d heyzen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: heyzen_admin
          MINIO_ROOT_PASSWORD: heyzen_test_password123
        ports:
          - 9000:9000
        options: >-
          server /data

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsm6 libxext6 libgl1

      - name: Install Python Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Check Python Syntax & Compilation
        working-directory: backend
        run: |
          python -m compileall app/ tests/ scripts/

      - name: Run Alembic Migrations Against Service Database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://heyzen:heyzen_test_password@127.0.0.1:5432/heyzen
        run: |
          alembic upgrade head
          CURRENT=$(alembic current)
          echo "Current Alembic Head: $CURRENT"
          echo "$CURRENT" | grep -q "0005_jobs_task_pipeline"

      - name: Execute Full Pytest Test Suite
        working-directory: backend
        env:
          APP_ENV: test
          DEBUG: "true"
          DATABASE_URL: postgresql+asyncpg://heyzen:heyzen_test_password@127.0.0.1:5432/heyzen
          REDIS_URL: redis://127.0.0.1:6379/0
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: heyzen_admin
          MINIO_SECRET_KEY: heyzen_test_password123
          AI_RUNTIME_MODE: mock
          AI_PROVIDER_MODE: mock
        run: |
          pytest tests/ -q
